# Alembic config for the Beam API.
#
# The database URL is NOT read from this file — env.py pulls it from app
# settings (settings.database_url), so it stays in sync with the app and never
# diverges. The sqlalchemy.url below is a non-functional placeholder.
#
# Run from repo root (local) or /app (Docker):
#   alembic -c apps/api/alembic.ini upgrade head
#   alembic -c apps/api/alembic.ini revision --autogenerate -m "msg"

[alembic]
# %(here)s = the directory containing this file (apps/api), so this resolves
# regardless of the current working directory.
script_location = %(here)s/migrations
prepend_sys_path = .
sqlalchemy.url = driver://placeholder:set-in-env-py@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
