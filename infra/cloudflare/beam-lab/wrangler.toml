name = "beam-lab"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# BEAM_FETCH_BEACON_SECRET is NOT here — it is a credential:
#   npx wrangler pages secret put BEAM_FETCH_BEACON_SECRET --project-name beam-lab
# It must equal BEAM_FETCH_BEACON_SECRET in the API's .env, or every beacon 401s
# and nothing on the dashboard explains why.
[vars]
# Must be the FULL API host. beam-dev.nhantown.com exposes only the three pixel
# paths and would 404 the beacon endpoint.
BEAM_API_BASE = "https://beam-api.nhantown.com"
BEAM_SITE_ID = "site_16c46453546f"
