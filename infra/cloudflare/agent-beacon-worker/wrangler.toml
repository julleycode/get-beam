# RETIRED — do not wrangler deploy.
# This Worker used to bind a third-party lab hostname. Routes are removed so a
# deploy cannot re-attach GetBeam to that zone. Do not point BEAM_API_BASE at
# production (api.getbeam.fyi). Do not delete third-party lab DNS from this repo.
name = "beam-agent-beacon"
main = "worker.js"
compatibility_date = "2024-11-01"

# BEAM_FETCH_BEACON_SECRET is NOT here on purpose — it is a credential.
#   wrangler secret put BEAM_FETCH_BEACON_SECRET
# It must equal BEAM_FETCH_BEACON_SECRET in the API's .env, or every beacon
# gets a 401 that nothing on the dashboard will explain.
[vars]
BEAM_API_BASE = "https://retired.invalid"
BEAM_SITE_ID = "site_e3a2c56e01ed"

[env.splittrip]
# No routes. Do not re-attach a zone. Do not wrangler deploy.

[env.splittrip.vars]
BEAM_API_BASE = "https://retired.invalid"
BEAM_SITE_ID = "site_e3a2c56e01ed"
