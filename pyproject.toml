[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--ignore=tests/e2e_disposable"
markers = [
    "unit: Pure function tests, no DB or network needed",
    "integration: Tests that require PostgreSQL and/or Redis",
    "disposable: Disposable-container e2e lane (opt-in; excluded by addopts above)",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.20",
    "asgi-lifespan>=2.1",
]
