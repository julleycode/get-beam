name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Unit Tests (no DB needed) ────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis

      - name: Run unit tests
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql+asyncpg://localhost/test"
          REDIS_URL: "redis://localhost:6379/15"
        run: |
          PYTHONPATH=. python -m pytest tests/unit/ -v --tb=short

  # ─── Backend Integration Tests (with PostgreSQL + Redis) ──
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retarget
          POSTGRES_PASSWORD: retarget_dev
          POSTGRES_DB: retarget_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis

      - name: Run integration tests
        env:
          APP_ENV: test
          DATABASE_URL: "postgresql+asyncpg://retarget:retarget_dev@localhost:5432/retarget_agent_test"
          REDIS_URL: "redis://localhost:6379/15"
        run: |
          PYTHONPATH=. python -m pytest tests/integration/ -v --tb=short -m integration

  # ─── Pixel: size budget + capture e2e ─────────────────────
  # Net-new job (AC-WS2-6): apps/pixel had no CI job before WS2. The size gate is
  # zero-dependency (esbuild build + gzip|wc -c) and HARD-FAILS the build if the
  # compiled tracker.min.js exceeds the documented 5,120-byte gzip ceiling
  # (apps/pixel/package.json "must stay <5KB gzipped").
  pixel:
    name: Pixel (size budget + e2e)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pixel dev dependencies
        working-directory: apps/pixel
        run: npm install --no-audit

      - name: Build minified tracker
        working-directory: apps/pixel
        run: npm run build

      - name: Enforce tracker size budget (gzip <= 5120 bytes)
        working-directory: apps/pixel
        run: |
          SIZE=$(gzip -c src/tracker.min.js | wc -c | tr -d ' ')
          echo "tracker.min.js gzip size: ${SIZE} bytes (ceiling 5120)"
          if [ "$SIZE" -gt 5120 ]; then
            echo "::error::tracker.min.js is ${SIZE} bytes gzipped, over the 5120-byte budget"
            exit 1
          fi

      - name: Install Playwright (chromium)
        working-directory: apps/pixel
        run: npx playwright install --with-deps chromium

      - name: Run pixel capture e2e (chromium)
        working-directory: apps/pixel
        run: npx playwright test --project=chromium

  # ─── Frontend E2E Tests (Playwright) ──────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retarget
          POSTGRES_PASSWORD: retarget_dev
          POSTGRES_DB: retarget_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        working-directory: apps/web
        run: npm install --no-audit

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Seed test user
        env:
          DATABASE_URL: "postgresql+asyncpg://retarget:retarget_dev@localhost:5432/retarget_agent"
          REDIS_URL: "redis://localhost:6379/0"
          APP_ENV: test
        run: |
          PYTHONPATH=. python -c "
          import asyncio, bcrypt
          from apps.api.models.database import engine, Base, async_session
          from apps.api.models.user import User
          from apps.api.models import social_account, post, message, campaign, draft, enrichment, segment, voice_example, site, blog_post  # noqa
          async def seed():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              async with async_session() as db:
                  from sqlalchemy import select
                  exists = await db.execute(select(User).where(User.email == 'demo@getbeam.fyi'))
                  if not exists.scalar_one_or_none():
                      pw = bcrypt.hashpw(b'password123', bcrypt.gensalt()).decode()
                      db.add(User(email='demo@getbeam.fyi', hashed_password=pw, full_name='Demo User'))
                      await db.commit()
                  admin = await db.execute(select(User).where(User.email == 'admin@getbeam.fyi'))
                  if not admin.scalar_one_or_none():
                      pw = bcrypt.hashpw(b'password123', bcrypt.gensalt()).decode()
                      db.add(User(email='admin@getbeam.fyi', hashed_password=pw, full_name='Admin User', is_admin=True))
                      await db.commit()
          asyncio.run(seed())
          "

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql+asyncpg://retarget:retarget_dev@localhost:5432/retarget_agent"
          REDIS_URL: "redis://localhost:6379/0"
          APP_ENV: test
        run: npx playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
